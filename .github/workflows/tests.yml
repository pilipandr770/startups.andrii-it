name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # `python -m pytest`, not a bare `pytest` — the plain console-script
      # entry point doesn't add the repo root to sys.path, so `from app
      # import create_app` in every test file fails with "No module named
      # 'app'" (only surfaces here; local/VPS runs already used `python -m
      # pytest`, which does add cwd to sys.path).
      - name: Run tests
        run: python -m pytest tests/ -v

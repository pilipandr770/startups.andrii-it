services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - uploads_data:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    # No ports published directly — Nginx (on the shared VPS reverse proxy
    # network, per your existing infra pattern) routes to this by service name.

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: startupshowcase
      POSTGRES_USER: startupshowcase
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U startupshowcase -d startupshowcase"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
  uploads_data:

networks:
  internal:
    driver: bridge

# Example server block for your existing VPS Nginx reverse-proxy setup.
# Adapt paths/domain to match your current pattern (per your other projects:
# one Nginx in front, each app in its own Docker container, subdomain routing).

server {
    listen 80;
    server_name startups.andrii-it.de;  # replace with your chosen subdomain

    location / {
        proxy_pass http://startup-showcase-web:5000;  # docker-compose service name
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }
}

# After this is working on HTTP, run certbot to add HTTPS, exactly as with
# your other subdomains on this VPS:
#   certbot --nginx -d startups.andrii-it.de
